<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arshad Rafi - OG Social Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #0A0A0B;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #E8E8E3;
        }

        .og-card {
            position: relative;
            width: 1200px;
            height: 630px;
            background: #0A0A0B;
            padding: 48px 60px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Subtle tactical grid background pattern */
        .og-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(232, 232, 227, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232, 232, 227, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle dark gradient overlay to ensure text contrast */
        .og-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(8, 8, 7, 0.3) 0%, rgba(8, 8, 7, 0.65) 65%, rgba(8, 8, 7, 0.92) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* ASCII Hands Background Texture - Chalk Monochrome */
        .og-hands {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 1220px;
            height: auto;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            opacity: 0.95;
            filter: contrast(1.25) brightness(1.15);
        }

        /* Top Header */
        .og-top {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .og-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Navbar-style floating capsule */
        .og-capsule {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px 8px 10px;
            background: rgba(18, 18, 20, 0.85);
            border: 1px solid rgba(232, 232, 227, 0.16);
            border-radius: 9999px;
            backdrop-filter: blur(12px);
        }

        /* Pixel Monogram Logo Icon */
        .og-logo {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #18181B;
            border: 1px solid rgba(232, 232, 227, 0.22);
            border-radius: 6px;
        }

        .og-logo svg {
            width: 20px;
            height: 20px;
            image-rendering: pixelated;
        }

        .og-brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .og-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
            color: #E8E8E3;
            line-height: 1.1;
        }

        .og-role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: #8E8E88;
            text-transform: uppercase;
        }

        .og-top-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8E8E88;
        }

        .og-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: 1px solid rgba(232, 232, 227, 0.12);
            background: rgba(18, 18, 20, 0.6);
            border-radius: 9999px;
            color: #E8E8E3;
        }

        .og-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #E8E8E3;
            box-shadow: 0 0 8px rgba(232, 232, 227, 0.6);
        }

        /* Hero Headline */
        .og-hero {
            position: relative;
            z-index: 3;
            margin-top: 20px;
            max-width: 1040px;
        }

        .og-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 68px;
            line-height: 1.12;
            letter-spacing: -0.035em;
            color: #E8E8E3;
        }

        .og-title-line {
            display: block;
        }

        .og-title-line + .og-title-line {
            margin-top: 14px;
        }

        /* Tactical Mark Badge - Signature Off-White on Dark */
        mark {
            background: #E8E8E3;
            color: #080807;
            padding: 0 16px;
            font-weight: 600;
            display: inline-block;
            line-height: 1.06;
            vertical-align: baseline;
            letter-spacing: -0.035em;
        }

        /* Bottom Footer Bar */
        .og-bottom {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(232, 232, 227, 0.12);
            padding-top: 22px;
        }

        .og-tags {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .og-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 12px;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(232, 232, 227, 0.12);
            color: #8E8E88;
            border-radius: 4px;
        }

        .og-url {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.06em;
            color: #E8E8E3;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(18, 18, 20, 0.85);
            border: 1px solid rgba(232, 232, 227, 0.2);
            border-radius: 4px;
        }

        .og-url-arrow {
            color: #8E8E88;
            font-size: 14px;
        }

        /* Corner Technical Crosshairs */
        .og-corner {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(232, 232, 227, 0.25);
            user-select: none;
            z-index: 3;
        }
        .og-corner-tl { top: 16px; left: 20px; }
        .og-corner-tr { top: 16px; right: 20px; }
        .og-corner-bl { bottom: 16px; left: 20px; }
        .og-corner-br { bottom: 16px; right: 20px; }
    </style>
</head>
<body>
    <div class="og-card">
        <!-- Corner Technical Marks -->
        <div class="og-corner og-corner-tl">+</div>
        <div class="og-corner og-corner-tr">+</div>
        <div class="og-corner og-corner-bl">+</div>
        <div class="og-corner og-corner-br">+</div>

        <!-- Vignette & ASCII Hands Texture -->
        <div class="og-vignette"></div>
        <img class="og-hands" src="./assets/hero-hands-chalk.webp" alt="ASCII Hands Texture">

        <!-- Top Row: Brand & Status -->
        <header class="og-top">
            <div class="og-brand">
                <div class="og-capsule">
                    <div class="og-logo">
                        <!-- Pixel Monogram 'A' exact SVG matching site -->
                        <svg viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="1" width="5" height="1" fill="#E8E8E3"/>
                            <rect x="2" y="2" width="2" height="1" fill="#E8E8E3"/>
                            <rect x="7" y="2" width="2" height="1" fill="#E8E8E3"/>
                            <rect x="1" y="3" width="2" height="5" fill="#E8E8E3"/>
                            <rect x="8" y="3" width="2" height="5" fill="#E8E8E3"/>
                            <rect x="3" y="5" width="5" height="1" fill="#E8E8E3"/>
                            <rect x="1" y="8" width="3" height="2" fill="#E8E8E3"/>
                            <rect x="7" y="8" width="3" height="2" fill="#E8E8E3"/>
                        </svg>
                    </div>
                    <div class="og-brand-text">
                        <span class="og-name">Muhammed Arshad</span>
                        <span class="og-role">AI Researcher &amp; Builder</span>
                    </div>
                </div>
            </div>

            <div class="og-top-meta">
                <span class="og-loc">Kerala, IN // 11.2588° N</span>
                <div class="og-status">
                    <span class="og-status-dot"></span>
                    <span>Available 2026</span>
                </div>
            </div>
        </header>

        <!-- Center: Hero Statement in Space Grotesk with Signature Tactical Mark -->
        <main class="og-hero">
            <h1 class="og-title">
                <span class="og-title-line"><mark>AI Research</mark> &amp; Systems,</span>
                <span class="og-title-line">engineered for <mark>the Frontier.</mark></span>
            </h1>
        </main>

        <!-- Bottom Row: Focus Tags & Domain -->
        <footer class="og-bottom">
            <div class="og-tags">
                <span class="og-tag">Autonomous Agents</span>
                <span class="og-tag">Computer Vision</span>
                <span class="og-tag">Systems Security</span>
                <span class="og-tag">Zero-Shot Triaging</span>
            </div>
            <div class="og-url">
                <span>arshadrafi.dev</span>
                <span class="og-url-arrow">↗</span>
            </div>
        </footer>
    </div>
</body>
</html>
