<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background:#090908; font-family: monospace;">
    <defs>
        <!-- Background radial gradient -->
        <radialGradient id="meshGlow" cx="50%" cy="50%" r="65%">
            <stop offset="0%" stop-color="#1A1A18" />
            <stop offset="60%" stop-color="#0E0E0D" />
            <stop offset="100%" stop-color="#080807" />
        </radialGradient>
        <!-- Linear gradient for lines -->
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(232, 232, 227, 0.6)" />
            <stop offset="50%" stop-color="rgba(232, 232, 227, 0.2)" />
            <stop offset="100%" stop-color="rgba(255, 255, 255, 0.8)" />
        </linearGradient>
        <!-- Subtle Grid Pattern -->
        <pattern id="tacticalGrid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(232, 232, 227, 0.05)" stroke-width="1" />
            <circle cx="60" cy="0" r="1.5" fill="rgba(232, 232, 227, 0.15)" />
        </pattern>
    </defs>

    <!-- Canvas Base -->
    <rect width="1080" height="1350" fill="url(#meshGlow)" />
    <rect width="1080" height="1350" fill="url(#tacticalGrid)" />

    <!-- Corner Framing & Telemetry Labels -->
    <g fill="none" stroke="rgba(232, 232, 227, 0.3)" stroke-width="1.5">
        <path d="M 60 100 L 60 60 L 100 60" />
        <path d="M 980 60 L 1020 60 L 1020 100" />
        <path d="M 60 1250 L 60 1290 L 100 1290" />
        <path d="M 980 1290 L 1020 1290 L 1020 1250" />
    </g>

    <!-- Header Telemetry -->
    <g fill="#A0A09C" font-size="14" letter-spacing="3">
        <text x="75" y="85">SYSTEM // NEUROMESH_CORE</text>
        <text x="1005" y="85" text-anchor="end">STATUS: CONSENSUS_ACTIVE</text>
    </g>

    <g fill="#686864" font-size="12" letter-spacing="2">
        <text x="75" y="1275">LATENCY: 1.2MS // TOPOLOGY: FULL_MESH</text>
        <text x="1005" y="1275" text-anchor="end">AUTONOMOUS NODES: 64</text>
    </g>

    <!-- Center Swarm Constellation -->
    <g stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.75">
        <line x1="540" y1="420" x2="280" y2="580" />
        <line x1="540" y1="420" x2="800" y2="580" />
        <line x1="280" y1="580" x2="380" y2="880" />
        <line x1="800" y1="580" x2="700" y2="880" />
        <line x1="380" y1="880" x2="700" y2="880" />
        <line x1="540" y1="420" x2="540" y2="680" />
        <line x1="280" y1="580" x2="540" y2="680" />
        <line x1="800" y1="580" x2="540" y2="680" />
        <line x1="380" y1="880" x2="540" y2="680" />
        <line x1="700" y1="880" x2="540" y2="680" />
        <line x1="540" y1="680" x2="540" y2="1020" />
        <line x1="380" y1="880" x2="540" y2="1020" />
        <line x1="700" y1="880" x2="540" y2="1020" />
    </g>

    <!-- Concentric Target Reticles Around Primary Orchestrator Node -->
    <circle cx="540" cy="680" r="160" fill="none" stroke="rgba(232, 232, 227, 0.08)" stroke-width="1" />
    <circle cx="540" cy="680" r="120" fill="none" stroke="rgba(232, 232, 227, 0.15)" stroke-width="1" stroke-dasharray="8 8" />
    <circle cx="540" cy="680" r="80" fill="none" stroke="rgba(232, 232, 227, 0.25)" stroke-width="1.5" />

    <!-- Node 1: Apex Leader -->
    <g transform="translate(540, 420)">
        <circle r="14" fill="#080807" stroke="#FFFFFF" stroke-width="2" />
        <circle r="5" fill="#FFFFFF" />
        <text x="24" y="5" fill="#E8E8E3" font-size="13" letter-spacing="2">NODE_00 // LEADER</text>
    </g>

    <!-- Node 2: Left Agent Cluster -->
    <g transform="translate(280, 580)">
        <circle r="12" fill="#080807" stroke="#E8E8E3" stroke-width="2" />
        <circle r="4" fill="#E8E8E3" />
        <text x="-24" y="5" fill="#E8E8E3" font-size="13" letter-spacing="2" text-anchor="end">AGENT_A1 // PLANNER</text>
    </g>

    <!-- Node 3: Right Agent Cluster -->
    <g transform="translate(800, 580)">
        <circle r="12" fill="#080807" stroke="#E8E8E3" stroke-width="2" />
        <circle r="4" fill="#E8E8E3" />
        <text x="24" y="5" fill="#E8E8E3" font-size="13" letter-spacing="2">AGENT_B2 // EXECUTOR</text>
    </g>

    <!-- Node 4: Center Core Consensus -->
    <g transform="translate(540, 680)">
        <rect x="-30" y="-30" width="60" height="60" fill="#141413" stroke="#FFFFFF" stroke-width="2.5" />
        <rect x="-18" y="-18" width="36" height="36" fill="#080807" stroke="rgba(232, 232, 227, 0.6)" stroke-width="1.5" />
        <circle r="6" fill="#FFFFFF" />
        <text x="45" y="6" fill="#FFFFFF" font-size="14" font-weight="bold" letter-spacing="2">CONSENSUS_CORE</text>
    </g>

    <!-- Node 5: Lower Left Verifier -->
    <g transform="translate(380, 880)">
        <circle r="11" fill="#080807" stroke="#E8E8E3" stroke-width="1.8" />
        <circle r="4" fill="#E8E8E3" />
        <text x="-22" y="5" fill="#A0A09C" font-size="12" letter-spacing="2" text-anchor="end">AUDIT_V3</text>
    </g>

    <!-- Node 6: Lower Right Memory Mesh -->
    <g transform="translate(700, 880)">
        <circle r="11" fill="#080807" stroke="#E8E8E3" stroke-width="1.8" />
        <circle r="4" fill="#E8E8E3" />
        <text x="22" y="5" fill="#A0A09C" font-size="12" letter-spacing="2">MEMORY_STORE</text>
    </g>

    <!-- Node 7: Telemetry Gateway Egress -->
    <g transform="translate(540, 1020)">
        <circle r="12" fill="#080807" stroke="#FFFFFF" stroke-width="2" />
        <circle r="4" fill="#FFFFFF" />
        <text x="24" y="5" fill="#E8E8E3" font-size="13" letter-spacing="2">EGRESS // SINK</text>
    </g>

    <!-- Decorative Binary Ticker at Center Bottom -->
    <g fill="rgba(232, 232, 227, 0.4)" font-size="11" letter-spacing="4" text-anchor="middle">
        <text x="540" y="1140">01001110 01000101 01010101 01010010 01001111 01001101 01000101 01010011 01001000</text>
        <text x="540" y="1165">HASH: 7FA8B92C4E01D93F // FAULT_RECOVERY: ENGAGED</text>
    </g>
</svg>
